apiVersion: v1
kind: ConfigMap
metadata:
  name: api-simulador-habitacional-config
  labels:
    app.kubernetes.io/name: api-simulador-habitacional
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*",
      "Kestrel": {
        "Endpoints": {
          "Http": {
            "Url": "http://0.0.0.0:8080"
          }
        }
      }
    }